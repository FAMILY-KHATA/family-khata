<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Khata</title>
<meta name="description" content="Family ledger for cash, bank, held money and events">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
</body>
</html>
<style>
/* Layout: one narrow column (phone first), bottom tab bar, floating Add button, bottom-sheet forms.
   Palette: ledger-book green-grey paper, deep teal accent, green = money in, red = money out, amber = held for others, violet = events. */
:root{
  --bg:#EDF1EE;--surface:#FFFFFF;--soft:#E2E9E5;--ink:#15221E;--muted:#58695F;--line:#D3DCD7;
  --accent:#0E5A55;--accent-ink:#FFFFFF;--in:#1B7A4A;--out:#B03A2A;
  --c-own:#0E5A55;--c-held:#A06500;--c-event:#5A4A9C;--warn-bg:#FBEFD5;--warn-ink:#6B4300;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513;--surface:#17211E;--soft:#1F2C28;--ink:#E5EEEA;--muted:#92A49B;--line:#2B3834;
  --accent:#5EC2B4;--accent-ink:#06201C;--in:#5FCB92;--out:#F28B79;
  --c-own:#5EC2B4;--c-held:#E2B057;--c-event:#AB9DE8;--warn-bg:#3A2E12;--warn-ink:#F2D9A0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513;--surface:#17211E;--soft:#1F2C28;--ink:#E5EEEA;--muted:#92A49B;--line:#2B3834;
  --accent:#5EC2B4;--accent-ink:#06201C;--in:#5FCB92;--out:#F28B79;
  --c-own:#5EC2B4;--c-held:#E2B057;--c-event:#AB9DE8;--warn-bg:#3A2E12;--warn-ink:#F2D9A0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button,a,select,input,textarea{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:0}
#app{max-width:560px;margin:0 auto;padding-bottom:150px}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0 14px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.top .sub{color:var(--muted);font-size:13px}
.top>div:first-child{min-width:0}
.sync{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;min-height:30px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync.ok i{background:var(--in)}.sync.busy i{background:var(--c-held)}.sync.demo i{background:var(--c-event)}
.back{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:500;min-height:44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.hero .lbl{color:var(--muted);font-size:13px}
.hero .big{font-size:34px;font-weight:500;margin:2px 0 4px}
.hero .small{color:var(--muted);font-size:13px;margin-bottom:12px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);gap:2px}
.bar i{display:block;min-width:0}
.legend{display:grid;gap:8px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;justify-content:space-between}
.legend .dot{width:10px;height:10px;border-radius:2px;flex:none}
.legend .l{display:flex;align-items:center;gap:8px;min-width:0}
h2.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px}
h3.sub3{font-size:14px;font-weight:600;margin:0 0 6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.acct{display:grid;gap:8px}
.acct .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.acct .split{display:grid;gap:3px;color:var(--muted);font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.acct .split div{display:flex;justify-content:space-between;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:13px}
.btn.danger{color:var(--out);border-color:var(--out)}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.row:last-child{border-bottom:0}
.row.plain{cursor:default}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.row .r{text-align:right;flex:none}
.row>div:first-child{min-width:0}
.in{color:var(--in)}.out{color:var(--out)}.mv{color:var(--muted)}
.pos{color:var(--in)}.neg{color:var(--out)}
.grp{font-size:12px;color:var(--muted);padding:12px 0 2px;font-weight:600}
.alert{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alert button{background:none;border:1px solid currentColor;border-radius:6px;padding:4px 10px;min-height:32px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sm{min-height:32px;padding:3px 12px;font-size:13px;background:var(--bg)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;white-space:nowrap}
.badge.p{color:var(--c-held);border-color:var(--c-held)}
.badge.e{color:var(--c-event);border-color:var(--c-event)}
.badge.f{color:var(--accent);border-color:var(--accent)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:10px;min-height:44px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 22px;height:52px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:5;display:flex;align-items:center;gap:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:4}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:48px;padding:2px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;z-index:21;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:560px;margin:0 auto}
.sheet h3{font-size:17px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:44px;font-size:13.5px;font-weight:500;padding:4px 2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.fld textarea{min-height:70px}
.fld .amt{font-size:26px;font-family:var(--mono);padding:10px 12px}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0 8px;min-height:44px}
.chk input{width:22px;height:22px;flex:none}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.newbox{margin-top:6px;padding:10px;border:1px dashed var(--accent);border-radius:8px}
.err{color:var(--out);font-size:14px;margin:4px 0 10px;background:var(--bg);border:1px solid var(--out);border-radius:8px;padding:9px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:14px;max-width:90%}
.empty{color:var(--muted);padding:6px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;align-items:baseline}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:600}
.sample{background:var(--soft);border-radius:10px;padding:11px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:90px}
.help{color:var(--muted);font-size:13.5px}
.help b{color:var(--ink)}
ol.steps,ul.steps{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:4px 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 6px;text-align:right;border-top:1px solid var(--line)}
.tbl tr.tt td{font-weight:600}
.tscroll{overflow-x:auto}
.ctx{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ctx .hd{padding:12px 14px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.ctx .hd .t{font-weight:600;overflow-wrap:anywhere}
.ctx .hd .s{font-size:12.5px;color:var(--muted)}
.ctx .mini{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.ctx .mini div{padding:8px 6px;text-align:center;min-width:0}
.ctx .mini .k{font-size:11px;color:var(--muted)}
.ctx .mini .v{font-size:13px}
.ctx .rows{padding:0 14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
/* ---------- helpers ---------- */
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var ETYPES=['Engagement','Marriage','Child birth','Birthday','Other'];
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function P(x){return Math.round((parseFloat(x)||0)*100)}
function fmt(p){var neg=p<0;p=Math.abs(p);var s=(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2});return (neg?'−':'')+'₹'+s}
function pad(n){return String(n).padStart(2,'0')}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return isoOf(new Date())}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return isoOf(d)}
function fdate(iso){var a=(iso||'').split('-');return a.length<3?'':(+a[2])+' '+MON[a[1]-1]+' '+a[0]}
function norm(s){return (s||'').trim().toLowerCase()}
function poss(n){return n+"'s"}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ---------- state ---------- */
var KEY='familyKhata.v2',KEY1='familyKhata.v1',COLS=['accounts','funds','people','entries','items'];
var S,storageOK=true;
var mode='local',DB=null,remote={},got={},fresh={},syncState='off',seedChecked=false,offerUpload=false,demo=false,wq={};
function blank(){return {v:2,accounts:[{id:'cash',name:'Cash',kind:'cash',ord:0},{id:'bank',name:'Bank account',kind:'bank',ord:1}],
  funds:[{id:'own',name:'My own money',kind:'own',ord:0}],people:[],entries:[],items:[]}}
/* an older version had a separate "lent" type; lending is now just money paid out */
function normEntries(arr){return (arr||[]).map(function(e){if(e.type==='adv'){e=Object.assign({},e);e.type='out'}return e})}
function upgrade(j){
  j.v=2;j.people=j.people||[];j.entries=normEntries(j.entries);j.items=j.items||[];
  j.accounts.forEach(function(a,i){if(a.ord==null)a.ord=i});
  j.funds.forEach(function(f,i){if(f.ord==null)f.ord=i;if(f.kind==='event'){f.member=f.member||'';f.etype=f.etype||'Other';f.date=f.date||''}});
  return j;
}
function loadLocal(){
  try{var r=lsGet(KEY)||lsGet(KEY1);if(r){var j=JSON.parse(r);if(j&&(j.v===1||j.v===2)&&j.accounts&&j.funds)return upgrade(j)}}catch(e){}
  return blank();
}
function saveLocal(){storageOK=lsSet(KEY,JSON.stringify(S))}
function localHasData(){var j=loadLocal();return j.entries.length>0||j.items.length>0||j.funds.length>1||j.people.length>0}
function byOrd(a,b){return (a.ord==null?1e15:a.ord)-(b.ord==null?1e15:b.ord)||(a.name<b.name?-1:1)}
function applyRemote(){
  var n=blank();
  COLS.forEach(function(c){if(remote[c]&&remote[c].length)n[c]=remote[c].map(function(x){return Object.assign({},x)})});
  if(!(remote.entries&&remote.entries.length))n.entries=[];if(!(remote.items&&remote.items.length))n.items=[];if(!(remote.people&&remote.people.length))n.people=[];
  n.entries=normEntries(n.entries);
  n.accounts.sort(byOrd);n.funds.sort(byOrd);n.people.sort(function(a,b){return a.name<b.name?-1:1});
  S=n;
}
function fundById(id){return S.funds.filter(function(f){return f.id===id})[0]}
function accById(id){return S.accounts.filter(function(a){return a.id===id})[0]}
function fname(id){var f=fundById(id);return f?f.name:'(removed)'}
function aname(id){var a=accById(id);return a?a.name:'(removed)'}

/* ---------- storing records (this phone, or the shared database) ---------- */
function dbWrite(path,fn){
  var p=(wq[path]||Promise.resolve()).then(fn).catch(function(err){
    var c=err&&err.code;toast(c==='quota_exceeded'?'The shared storage is full.':c==='invalid_argument'?'Could not save. This account may have view-only access.':'Could not save. Check the connection.');
    if(mode==='sync'&&!demo){applyRemote();render()}
  });
  wq[path]=p;return p;
}
function put(col,rec){
  var arr=S[col],i=-1;arr.forEach(function(x,k){if(x.id===rec.id)i=k});if(i>=0)arr[i]=rec;else arr.push(rec);
  if(demo)return;
  if(mode==='sync')dbWrite(col+'/'+rec.id,function(){return DB.collection(col).doc(rec.id).set(rec)});else saveLocal();
}
function del(col,id){
  S[col]=S[col].filter(function(x){return x.id!==id});
  if(demo)return;
  if(mode==='sync')dbWrite(col+'/'+id,function(){return DB.collection(col).doc(id).delete()});else saveLocal();
}
/* ---------- sync (your own Firebase project; the app also works fully without it) ---------- */
var FB_FILES=['vendor/firebase-app-compat.js','vendor/firebase-auth-compat.js','vendor/firebase-firestore-compat.js'];
var fbCfg=null,fbUser=null,fbAuthUnsub=null,subUnsubs=[],fbLoading=null,deferredPrompt=null;
var SY={cfg:'',email:'',pw:'',err:'',busy:false};
function getCfg(){
  try{if(window.KHATA_FIREBASE&&window.KHATA_FIREBASE.apiKey)return window.KHATA_FIREBASE}catch(e){}
  try{var r=lsGet('khata.fbcfg');if(r){var j=JSON.parse(r);if(j&&j.apiKey&&j.projectId)return j}}catch(e){}
  return null;
}
function parseCfg(txt){
  txt=(txt||'').trim();
  if(txt.indexOf('KHATA1:')===0){try{var o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(7)))));if(o&&o.c&&o.c.apiKey)return {cfg:o.c,email:o.e||''}}catch(e){}return null}
  var cfg={};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(function(k){
    var m=new RegExp('[\'"]?'+k+'[\'"]?\\s*:\\s*[\'"]([^\'"]+)[\'"]').exec(txt);if(m)cfg[k]=m[1]});
  if(!cfg.apiKey||!cfg.projectId||!cfg.appId)return null;
  if(!cfg.authDomain)cfg.authDomain=cfg.projectId+'.firebaseapp.com';
  return {cfg:cfg,email:''};
}
function setupText(){return 'KHATA1:'+btoa(unescape(encodeURIComponent(JSON.stringify({c:getCfg(),e:lsGet('khata.email')||''}))))}
function loadFirebase(){
  if(window.firebase&&firebase.firestore&&firebase.auth)return Promise.resolve();
  if(fbLoading)return fbLoading;
  fbLoading=FB_FILES.reduce(function(p,src){return p.then(function(){return new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load '+src))};document.head.appendChild(s)})})},Promise.resolve());
  return fbLoading;
}
async function startSync(){
  fbCfg=getCfg();
  if(!fbCfg){syncState='off';render();return}
  syncState='loading';
  try{await loadFirebase()}catch(e){fbLoading=null;syncState='error';SY.err='Could not load the sync files. Check the internet connection and reopen the app.';render();return}
  try{
    if(!firebase.apps.length){firebase.initializeApp(fbCfg);try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}}
  }catch(e){syncState='error';SY.err='The sync settings look wrong. Check them in More.';render();return}
  if(fbAuthUnsub)return;
  fbAuthUnsub=firebase.auth().onAuthStateChanged(function(u){fbUser=u;if(u)attach(u);else{detach();syncState='signedout';render()}});
}
function attach(u){
  detach();
  var base=firebase.firestore().collection('families').doc(u.uid);
  DB={collection:function(c){var ref=base.collection(c);return {
    doc:function(id){var d=ref.doc(id);return {set:function(r){return d.set(JSON.parse(JSON.stringify(r)))},delete:function(){return d.delete()}}},
    onSnapshot:function(a,b){return ref.onSnapshot({includeMetadataChanges:true},a,b)}}}};
  mode='sync';syncState='loading';remote={};got={};fresh={};seedChecked=false;
  setTimeout(function(){if(mode==='sync'&&!allGot()){syncState='slow';render()}},10000);
  COLS.forEach(function(c){
    subUnsubs.push(DB.collection(c).onSnapshot(function(snap){
      remote[c]=snap.docs.map(function(x){return Object.assign({},x.data())});
      got[c]=true;if(!snap.metadata.fromCache)fresh[c]=true;onRemote();
    },function(err){syncState=allGot()?'busy':'slow';if(err&&err.code==='permission-denied')SY.err='Sync was refused. Check the Firestore rules in the setup guide.';render()}));
  });
  render();
}
function detach(){subUnsubs.forEach(function(f){try{f()}catch(e){}});subUnsubs=[];DB=null;if(mode==='sync'){mode='local';S=loadLocal()}}
function authMsg(e){
  var c=e&&e.code||'';
  return ({'auth/invalid-credential':'The email or password is not right.','auth/wrong-password':'The email or password is not right.',

async function runJobs(jobs,label){
  var done=0,total=jobs.length,failed=false,i=0;
  function prog(){$('#layer').innerHTML='<div class="scrim"></div><div class="sheet" role="status"><h3>'+esc(label)+'</h3><p class="help">Saving '+done+' of '+total+'. Keep this page open.</p></div>'}
  prog();

    while(!failed&&i<jobs.length){var j=jobs[i++];
      for(var t=0;t<2;t++){try{var ref=DB.collection(j[0]).doc(j[1].id);if(j[2])await ref.delete();else await ref.set(j[1]);break}catch(e){if(t===1){failed=true}else await new Promise(function(r){setTimeout(r,500)})}}

/* ---------- the arithmetic ----------
   Every fund's balance is the money actually in hand for it (in cash and bank).
   Received adds. Paid out subtracts. Returned adds back, but is not new money:
   it reduces what that person got. Money lent out is simply paid out. */
function compute(ents){
  ents=ents||S.entries;
  var acc={},hand={},cell={};
  S.accounts.forEach(function(a){acc[a.id]=0});S.funds.forEach(function(f){hand[f.id]=0});
  function add(a,f,p){acc[a]=(acc[a]||0)+p;hand[f]=(hand[f]||0)+p;var k=a+'|'+f;cell[k]=(cell[k]||0)+p}
  ents.forEach(function(e){var p=P(e.amt),t=e.type;
    if(t==='in'||t==='ret')add(e.acc,e.fund,p);
    else if(t==='out')add(e.acc,e.fund,-p);
    else{add(e.acc,e.fund,-p);add(e.toAcc,e.toFund,p)}});
  return {acc:acc,fund:hand,held:hand,cell:cell};
}
function sumKind(C,kind){var t=0;S.funds.forEach(function(f){if(f.kind===kind)t+=(C.held[f.id]||0)});return t}
function totalOf(C){var t=0;S.accounts.forEach(function(a){t+=C.acc[a.id]||0});return t}
function effPerson(e){
  if(e.type==='move')return '';
  if(e.person&&e.person.trim())return e.person.trim();
  if(e.type==='in'){var f=fundById(e.fund);if(f&&f.kind==='person')return f.name}
  return '';
}
function srcOf(e,f){
  if(f&&f.kind==='person'&&(!e.person||norm(e.person)===norm(f.name)))return {label:poss(f.name)+' own money',name:f.name};
  var n=(e.person&&e.person.trim())||'';return {label:n||'(no name)',name:n};
}
function pairGroups(ents){
  var g={};
  ents.forEach(function(e){if(e.type!=='out'&&e.type!=='ret')return;var nm=effPerson(e),k=e.fund+'|'+norm(nm);
    if(!g[k])g[k]={fund:e.fund,name:nm,out:0,ret:0};
    if(e.type==='out')g[k].out+=P(e.amt);else g[k].ret+=P(e.amt)});
  return g;
}
/* returns a plain-words reason when a change would break the books, else '' */
function validate(ne){
  var gb=pairGroups(S.entries),ga=pairGroups(ne),k;
  for(k in ga){var a=ga[k],b=gb[k]||{out:0,ret:0},over=a.ret-a.out;
    if(over>0&&over>Math.max(0,b.ret-b.out)){
      var who=a.name||'That person';
      return a.out===0?'Nothing was paid to '+who+' from '+fname(a.fund)+', so nothing can come back from them.':who+' got '+fmt(a.out)+' from '+fname(a.fund)+'. Returns would total '+fmt(a.ret)+', which is '+fmt(over)+' too much.'}}
  var B=compute(),A=compute(ne),id;
  for(id in A.acc){if(A.acc[id]<0&&A.acc[id]<(B.acc[id]||0))return aname(id)+' has only '+fmt(Math.max(0,B.acc[id]||0))+'. This would take it below zero. Choose another account, or record the money coming in first.'}
  for(id in A.fund){if(A.fund[id]<0&&A.fund[id]<(B.fund[id]||0))return fname(id)+' has only '+fmt(Math.max(0,B.fund[id]||0))+' with you. This would take it below zero. Record the money coming in first.'}
  for(k in A.cell){if(A.cell[k]<0&&A.cell[k]<(B.cell[k]||0)){
    var pr=k.split('|'),where=S.accounts.filter(function(x){return (A.cell[x.id+'|'+pr[1]]||0)>0}).map(function(x){return fmt(A.cell[x.id+'|'+pr[1]])+' in '+x.name}).join(' and ');
    return fname(pr[1])+' has only '+fmt(Math.max(0,B.cell[k]||0))+' in '+aname(pr[0])+(where?' ('+where+' right now)':'')+'. Pay from the account that holds it, or use Move to shift it first.'}}
  return '';
}
function lines(fid){
  var out=[];
  S.entries.forEach(function(e){var p=P(e.amt),t=e.type;
    if(e.fund===fid){
      if(t==='in'||t==='ret')out.push({e:e,d:p});else if(t==='out')out.push({e:e,d:-p});else if(t==='move')out.push({e:e,d:-p,mv:'out'})}
    if(t==='move'&&e.toFund===fid)out.push({e:e,d:p,mv:'in'})});
  out.sort(function(a,b){return a.e.date<b.e.date?-1:a.e.date>b.e.date?1:(a.e.createdAt||0)-(b.e.createdAt||0)});
  var run=0;out.forEach(function(l){run+=l.d;l.run=run});return out;
}
function fundSummary(fid){
  var f=fundById(fid),L=lines(fid),src={},so=[],paid=0,back=0,mvout=0,added=0,per={},po=[];
  function addSrc(label,name,p){if(!src[label]){src[label]={label:label,name:name,amt:0};so.push(label)}src[label].amt+=p;added+=p}
  L.forEach(function(l){var e=l.e,t=e.type,p=Math.abs(l.d);
    if(t==='move'){if(e.fund===e.toFund)return;if(l.mv==='in')addSrc('Moved in from '+fname(e.fund),'',p);else mvout+=p;return}
    var who=effPerson(e)||'(no name)',k=norm(who);
    if(!per[k]){per[k]={name:who,gave:0,got:0,back:0};po.push(k)}
    if(t==='in'){var s=srcOf(e,f);addSrc(s.label,s.name,p);per[k].gave+=p}
    else if(t==='out'){paid+=p;per[k].got+=p}else{back+=p;per[k].back+=p}
  });
  var who=po.map(function(k){return per[k]}).filter(function(x){return x.got>0||x.back>0}).sort(function(a,b){return (b.got-b.back)-(a.got-a.back)});
  return {src:so.map(function(k){return src[k]}),added:added,paid:paid,back:back,mvout:mvout,who:who,per:po.map(function(k){return per[k]})};
}

/* ---------- people ---------- */
function personRec(name){var k=norm(name);return S.people.filter(function(p){return norm(p.name)===k})[0]||null}
function ensurePerson(name,family){
  name=(name||'').trim();if(!name)return;var r=personRec(name);
  if(!r)put('people',{id:uid(),name:name,rel:'',family:!!family});
  else if(family&&!r.family){r.family=true;put('people',r)}
}
function isFamily(name){
  var k=norm(name),r=personRec(name);if(r)return !!r.family;
  return S.funds.some(function(f){return (f.kind==='person'&&norm(f.name)===k)||(f.kind==='event'&&norm(f.member)===k)});
}
function allPeople(){var m={};
  function put_(n){n=(n||'').trim();if(n&&!m[norm(n)])m[norm(n)]=n}
  S.people.forEach(function(p){put_(p.name)});
  S.funds.forEach(function(f){if(f.kind==='person')put_(f.name);if(f.kind==='event')put_(f.member)});
  S.entries.forEach(function(e){put_(e.person)});S.items.forEach(function(i){put_(i.person)});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1});
}
function personFund(name){var k=norm(name),r=null;S.funds.forEach(function(f){if(f.kind==='person'&&norm(f.name)===k)r=f});return r}
function eventsOf(name){var k=norm(name);return S.funds.filter(function(f){return f.kind==='event'&&norm(f.member)===k}).sort(function(a,b){return (b.date||'')<(a.date||'')?-1:1})}
function ctxOrder(f){return !f?9:f.kind==='own'?0:f.kind==='person'?1:2}
function personCtx(name){
  var k=norm(name),ctx={},tot={gave:0,got:0,back:0};
  function get(fid){return ctx[fid]||(ctx[fid]={fid:fid,gave:0,got:0,back:0,rows:[]})}
  S.entries.forEach(function(e){
    if(e.type==='move'||norm(effPerson(e))!==k)return;
    var c=get(e.fund),p=P(e.amt);
    if(e.type==='in'){c.gave+=p;tot.gave+=p}else if(e.type==='out'){c.got+=p;tot.got+=p}else{c.back+=p;tot.back+=p}
    c.rows.push({k:'m',o:e})});
  S.items.forEach(function(i){if(norm(i.person)!==k)return;get(i.fund||'_').rows.push({k:'i',o:i})});
  var list=Object.keys(ctx).map(function(id){return ctx[id]});
  list.forEach(function(c){c.rows.sort(function(a,b){return a.o.date<b.o.date?1:a.o.date>b.o.date?-1:0})});
  list.sort(function(a,b){var fa=fundById(a.fid),fb=fundById(b.fid);return ctxOrder(fa)-ctxOrder(fb)||((fb&&fb.date||'')<(fa&&fa.date||'')?-1:1)});
  return {ctx:list,tot:tot};
}
function suggestNames(fid){
  var out=[],seen={};
  function add(n){n=(n||'').trim();if(n&&!seen[norm(n)]&&out.length<6){seen[norm(n)]=1;out.push(n)}}
  var f=fundById(fid);if(f){if(f.kind==='person')add(f.name);if(f.kind==='event')add(f.member)}
  S.entries.filter(function(e){return e.fund===fid&&e.type!=='move'}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).forEach(function(e){add(e.person)});
  return out;
}

function formErr(m){F.err=m;sheetForm();var s=$('.sheet');if(s)s.scrollTop=s.scrollHeight}
function makeFund(name,kind,etype,member,date){var f={id:uid(),name:name,kind:kind,ord:Date.now()};if(kind==='event'){f.etype=etype||'Other';f.member=(member||'').trim();f.date=date||''}return f}
function eventName(etype,member){return member?poss(member)+' '+etype:etype}
function bestAcc(fid){var C=compute(),best=S.accounts[0].id,bv=-1;S.accounts.forEach(function(a){var v=C.cell[a.id+'|'+fid]||0;if(v>bv){bv=v;best=a.id}});return best}
function setSwapDefaults(){
  var f=fundById(F.fund);
  if(!f||f.kind==='own'){var pf=S.funds.filter(function(x){return x.kind==='person'})[0];if(pf){F.fund=pf.id;f=pf}}
  if(f&&f.kind==='person'&&!F.person)F.person=f.name;
  F.toFund='own';
  var cash=S.accounts.filter(function(a){return a.kind==='cash'})[0];if(cash)F.toAcc=cash.id;
  F.acc=bestAcc(F.fund);
  if(F.acc===F.toAcc){var o=S.accounts.filter(function(a){return a.id!==F.toAcc})[0];if(o)F.acc=o.id}
}
/* A cash swap is three linked entries: their fund pays the person (so it shows in their ledger),
   your fund takes the same amount in the bank, and your fund pays the cash out. Balances tally. */
function swapEntries(o){
  var g=uid(),ca=Date.now(),nm=o.person,f1=fname(o.fund);
  function base(x,i){x.date=o.date;x.amt=o.amt;x.person=nm;x.grp=g;x.createdAt=ca+i;x.id=uid();return x}
  return [base({type:'out',acc:o.acc,fund:o.fund,note:o.note||('Cash given to '+nm+', settled from '+f1)},0),
          base({type:'in',acc:o.acc,fund:o.toFund,note:'Taken from '+f1+' for cash given to '+nm},1),
          base({type:'out',acc:o.toAcc,fund:o.toFund,note:'Cash given to '+nm+', settled from '+f1},2)];
}
function saveSwap(){
  var amt=parseFloat(String(F.amt).replace(/,/g,''));
  if(!(amt>0))return formErr('Enter an amount greater than zero.');
  var nm=(F.person||'').trim();if(!nm)return formErr('Write who got the cash.');
  if(!F.date)return formErr('Pick a date.');
  if(F.fund==='__new'||F.toFund==='__new')return formErr('Choose from the list for both fund choices.');
  if(F.fund===F.toFund)return formErr('Choose two different funds: the money it is taken from, and whose cash was given.');
  if(F.acc===F.toAcc)return formErr('Their money and the cash must be in different accounts, for example bank and cash.');
  var es=swapEntries({date:F.date,amt:Math.round(amt*100)/100,person:nm,fund:F.fund,acc:F.acc,toFund:F.toFund,toAcc:F.toAcc,note:(F.note||'').trim()});
  var err=validate(S.entries.concat(es));if(err)return formErr(err);
  es.forEach(function(e){put('entries',e)});lsSet('khata.lastAcc',F.toAcc);
  closeSheet();render();toast('Saved');
}
function sheetSwap(grp,err){
  var es=S.entries.filter(function(e){return e.grp===grp}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  var h='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><h3>Cash swap</h3><p class="help" style="margin-bottom:8px">These entries were saved together so every balance tallies. To change it, delete the swap and record it again.</p>'
   +es.map(function(e){return '<div class="kv"><span>'+esc(KL[e.type]+' · '+fname(e.fund)+' · '+aname(e.acc))+'</span><span class="num '+(e.type==='out'?'out':'in')+'">'+(e.type==='out'?'−':'+')+fmt(P(e.amt))+'</span></div>'}).join('')
   +(es[0]?'<p class="help" style="margin-top:6px">'+fdate(es[0].date)+' · '+esc(es[0].person)+'</p>':'')
   +(err?'<p class="err" role="alert">'+esc(err)+'</p>':'')
   +'<div class="actions"><button class="btn danger" data-act="swapdel" data-grp="'+esc(grp)+'" data-confirm="1">Delete swap</button><button class="btn" data-act="close">Close</button></div></div>';
  $('#layer').innerHTML=h;
}
function saveForm(again){
  if(F.type==='swap')return saveSwap();
  var t=F.type,money=t==='in'||t==='out'||t==='ret'||t==='move';
  if(!F.date)return formErr('Pick a date.');
  var fund=F.fund,toFund=F.toFund,nf=null,amt=0;
  if(F.newFor&&F[F.newFor]==='__new'){
    var nm=(F.newName||'').trim();
    if(F.newKind==='event')nm=nm||eventName(F.newType,(F.newMember||'').trim());
    if(!nm)return formErr('Give the new account or event a name.');
    if(S.funds.some(function(x){return norm(x.name)===norm(nm)}))return formErr('That name already exists. Choose it from the list.');
    nf=makeFund(nm,F.newKind,F.newType,F.newMember,F.date);
    if(F.newFor==='fund')fund=nf.id;else toFund=nf.id;
  }
  if(fund==='__new'||toFund==='__new')return formErr('Give the new account or event a name.');
  if(money){
    amt=parseFloat(String(F.amt).replace(/,/g,''));if(!(amt>0))return formErr('Enter an amount greater than zero.');
    if(t==='move'&&F.acc===F.toAcc&&fund===toFund)return formErr('Choose a different account or fund to move into.');
    if((t==='out'||t==='ret')&&!(F.person||'').trim())return formErr(t==='out'?'Write who got the money.':'Write who is giving it back.');
  }else if(!(F.name||'').trim())return formErr('Write what the item is.');
  var id=F.editId||uid(),ca=F.createdAt||Date.now(),o=null;
  if(money){
    o={id:id,type:t,date:F.date,amt:Math.round(amt*100)/100,acc:F.acc,fund:fund,person:t==='move'?'':(F.person||'').trim(),note:(F.note||'').trim(),createdAt:ca};
    if(t==='move'){o.toAcc=F.toAcc;o.toFund=toFund}
    if(nf)S.funds.push(nf);
    var err=validate(S.entries.filter(function(x){return x.id!==id}).concat([o]));
    if(nf)S.funds.pop();
    if(err)return formErr(err);
  }
  if(nf){put('funds',nf);if(nf.kind==='person')ensurePerson(nf.name,true);if(nf.kind==='event'&&nf.member)ensurePerson(nf.member,true)}
  if(money){put('entries',o);lsSet('khata.lastAcc',F.acc)}
  else put('items',{id:id,date:F.date,dir:t==='itemIn'?'in':'out',name:F.name.trim(),qty:(F.qty||'1').trim()||'1',person:(F.person||'').trim(),fund:fund||'',status:F.status,note:(F.note||'').trim(),createdAt:ca});
  if(again){var keep=F.type;F=newF(keep,fund);sheetForm();render();toast('Saved')}
  else{closeSheet();render();toast('Saved')}
}

      S.funds.forEach(function(f){var ch=false;

        if(f.kind==='event'&&norm(f.member)===oldK){if(f.name.indexOf(poss(G.old))===0)f.name=poss(nm)+f.name.slice(poss(G.old).length);f.member=nm;ch=true}

var R=null;
function openRecon(id){R={id:id,actual:'',fund:'own',err:''};sheetRecon()}
function sheetRecon(){
  var C=compute(),a=accById(R.id),book=C.acc[R.id]||0;
  var act=R.actual===''?null:P(R.actual),diff=act===null?null:act-book;
  var h='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><h3>Check '+esc(a.name)+'</h3>'
   +'<div class="kv"><span class="help">Khata says</span><span class="num" style="font-size:20px">'+fmt(book)+'</span></div>'
   +'<label class="fld"><span>'+(a.kind==='cash'?'Cash you counted (₹)':'Balance shown by the bank (₹)')+'</span><input class="amt" id="r_actual" inputmode="decimal" autocomplete="off" value="'+esc(R.actual)+'" placeholder="0"></label>'
   +'<div id="r_out">'+reconOut(diff)+'</div></div>';
  $('#layer').innerHTML=h;
}
function reconOut(diff){
  if(diff===null)return '<p class="help">Type the real amount to compare.</p>';
  if(diff===0)return '<p class="pos" style="font-weight:600;margin:6px 0 10px">Matches. Nothing is missing.</p><div class="actions"><button class="btn pri" data-act="close">Done</button></div>';
  return '<p style="margin:6px 0 10px"><b class="'+(diff>0?'pos':'neg')+'">'+(diff>0?'The real balance is '+fmt(diff)+' more':'The real balance is '+fmt(-diff)+' less')+'</b> than the khata. Look for an entry you forgot or typed wrongly. If you cannot find it, post an adjustment.</p>'
   +'<label class="fld"><span>Put the difference on</span><select id="r_fund">'+S.funds.map(function(f){return '<option value="'+f.id+'"'+(R.fund===f.id?' selected':'')+'>'+esc(f.name)+'</option>'}).join('')+'</select></label>'
   +(R.err?'<p class="err" role="alert">'+esc(R.err)+'</p>':'')+'<div class="actions"><button class="btn pri" data-act="radjust">Post adjustment</button><button class="btn" data-act="close">I will look for it</button></div>';
}
function postAdjust(){
  var C=compute(),book=C.acc[R.id]||0,diff=P(R.actual)-book;if(!diff)return;
  var adj={id:uid(),type:diff>0?'in':'out',date:today(),amt:Math.abs(diff)/100,acc:R.id,fund:R.fund,person:'Adjustment',note:'Adjustment after checking (real balance '+fmt(P(R.actual))+')',createdAt:Date.now()};
  var err=validate(S.entries.concat([adj]));
  if(err){R.err=err;return sheetRecon2()}
  put('entries',adj);closeSheet();R=null;render();toast('Adjustment posted');
}
function sheetRecon2(){var keep=R;sheetRecon();$('#r_actual').value=keep.actual}

/* ---------- backup, restore, export ---------- */
function backupText(){return JSON.stringify(S,null,1)}
async function saveFile(name,data){
  var ext=name.split('.').pop().toLowerCase(),type=ext==='json'?'application/json':ext==='csv'?'text/csv':'text/plain';
  var blob=new Blob([data],{type:type+';charset=utf-8'});
  try{
    var file=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  try{var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},5000);return true}
  catch(e){toast('Could not save the file. Use Copy backup text.');return false}
}
async function doBackup(){var ok=await saveFile('family-khata-backup-'+today()+'.json',backupText());if(ok){lsSet('khata.lastBackup',today());render();toast('Backup saved')}}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvText(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n')}
var KL={in:'Received',out:'Paid out',ret:'Returned back',move:'Move'};
function entryCsvRow(e){return [e.date,KL[e.type],e.amt,aname(e.acc),fname(e.fund),effPerson(e),e.type==='move'?aname(e.toAcc)+' / '+fname(e.toFund):'','','',e.note||'']}
var CSVH=['Date','Kind','Amount','Account','Fund or event','Person','Moved to','Item','Status','Note'];
function itemCsvRow(i){return [i.date,i.dir==='in'?'Item received':'Item given','','',i.fund?fname(i.fund):'',i.person||'','',i.name+(i.qty&&i.qty!=='1'?' x'+i.qty:''),i.status==='done'?'Settled':'Pending',i.note||'']}
function slug(s){return String(s).replace(/[^\w]+/g,'-')}
async function doCsv(){
  var rows=[CSVH];merged().slice().reverse().forEach(function(r){rows.push(r.k==='m'?entryCsvRow(r.o):itemCsvRow(r.o))});

function copyText(txt,ok){
  function fb(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();var d=false;try{d=document.execCommand('copy')}catch(e){}ta.remove();toast(d?ok:'Could not copy')}
  try{navigator.clipboard.writeText(txt).then(function(){toast(ok)},fb)}catch(e){fb()}
}
function parseBackup(t){var j;try{j=JSON.parse(t)}catch(e){return null}
  if(!j||(j.v!==1&&j.v!==2)||!Array.isArray(j.accounts)||!Array.isArray(j.funds)||!Array.isArray(j.entries)||!Array.isArray(j.items))return null;
  if(!j.accounts.length||!j.funds.length)return null;
  var ids=true;COLS.forEach(function(c){(j[c]||[]).forEach(function(r){if(!r||typeof r.id!=='string'||!/^[A-Za-z0-9_.~:@+-]+$/.test(r.id))ids=false})});
  if(!ids)return null;
  return upgrade({v:2,accounts:j.accounts,funds:j.funds,people:j.people||[],entries:j.entries,items:j.items});
}
function doRestore(){
  var f=$('#file'),p=$('#paste');
  if(f&&f.files&&f.files[0]){var rd=new FileReader();rd.onload=function(){var j=parseBackup(String(rd.result));if(j)replaceAll(j,'Restoring');else toast('That file is not a Family Khata backup')};rd.readAsText(f.files[0]);return}
  if(p&&p.value.trim()){var j=parseBackup(p.value.trim());if(j)replaceAll(j,'Restoring');else toast('That text is not a Family Khata backup');return}
  toast('Choose a file or paste the backup text first');
}

  else if(a==='newevent')openFundForm(null,el.dataset.name);
  else if(a==='editfund')openFundForm(el.dataset.id);
  else if(a==='holdfund'){var nm=el.dataset.name;ensurePerson(nm,true);if(!personFund(nm))put('funds',makeFund(nm,'person'));render();toast('Done')}
  else if(a==='newperson')openPersonForm();
  else if(a==='editperson')openPersonForm(el.dataset.name);
  else if(a==='newacc')openAccForm();else if(a==='editacc')openAccForm(el.dataset.id);
  else if(a==='gsave')saveSmall();
  else if(a==='gdel'){var id2=G.id;if(G.kind==='fund')del('funds',id2);else del('accounts',id2);closeSheet();G=null;if(view==='fund')back();else render()}
  else if(a==='flt'){flt=el.dataset.v;render()}
  else if(a==='pending'){flt='pending';Q='';tab('entries')}
  else if(a==='recon')openRecon(el.dataset.id);
  else if(a==='radjust')postAdjust();
  else if(a==='backup')doBackup();else if(a==='csv')doCsv();
  else if(a==='csvperson')csvPerson(el.dataset.name);else if(a==='csvfperson')csvFperson(el.dataset.fid,el.dataset.name);
  else if(a==='csvfund')csvFund(el.dataset.id);else if(a==='csvacct')csvAcct(el.dataset.id);
  else if(a==='copybackup')copyText(backupText(),'Backup text copied');
  else if(a==='restore')doRestore();
  else if(a==='sample')startDemo();
  else if(a==='exitdemo')exitDemo();
  else if(a==='upload')mergeUpload();
  else if(a==='dismissupload')dismissUpload();
  else if(a==='sy_cfg')saveCfg();
  else if(a==='sy_in')doSignIn(false);else if(a==='sy_new')doSignIn(true);
  else if(a==='sy_out'){try{firebase.auth().signOut()}catch(e){}}
  else if(a==='sy_copy')copyText(setupText(),'Setup text copied');
  else if(a==='install'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;render()}
  else if(a==='wipe'){replaceAll(blank(),'Erasing')}
}
function onInput(ev){
  var t=ev.target;
  if(t.id==='sy_cfg'){SY.cfg=t.value;return}
  if(t.id==='sy_email'){SY.email=t.value;return}
  if(t.id==='sy_pw'){SY.pw=t.value;return}
  if(t.id==='q'){Q=t.value;listEntries();return}
  if(t.id==='r_actual'){R.actual=t.value;R.err='';var C=compute(),book=C.acc[R.id]||0;$('#r_out').innerHTML=reconOut(t.value===''?null:P(t.value)-book);return}
  if(t.id==='r_fund'){R.fund=t.value;return}
  if(t.dataset.g&&G){G[t.dataset.g]=t.type==='checkbox'?t.checked:t.value;return}
  var k=t.dataset.k;if(!k||!F)return;F[k]=t.value;
  if(ev.type!=='change')return;
  if(k==='fund'||k==='toFund'){
    if(t.value==='__new'){F.newFor=k;sheetForm();var nn=$('#f_newName')||$('#f_newMember');if(nn)nn.focus()}
    else{if(F.newFor===k)F.newFor=null;
      if(F.type==='swap'&&k==='fund'){var ff=fundById(F.fund);if(ff&&ff.kind==='person'&&!F.person)F.person=ff.name;F.acc=bestAcc(F.fund);
        if(F.acc===F.toAcc){var oa=S.accounts.filter(function(x){return x.id!==F.toAcc})[0];if(oa)F.acc=oa.id}}
      sheetForm()}
  }else if(k==='newKind')sheetForm();
}
function registerSW(){
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('sw.js').catch(function(){})}
}
function boot(){
  S=loadLocal();
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('change',onInput);
  window.addEventListener('online',function(){render()});window.addEventListener('offline',function(){render()});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(view==='more')render()});
  window.addEventListener('appinstalled',function(){deferredPrompt=null;render()});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
  registerSW();
  startSync();
}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('app'))boot();
</script>
